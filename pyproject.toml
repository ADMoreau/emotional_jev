[project]
name = "facedecide"
version = "0.1.0"
description = "Audio-visual decision model for emotion (CREMA-D): typed, calibrated answers in one prefill pass"
requires-python = ">=3.11"
license = { text = "Code: Apache-2.0. Weights: Qwen Research License (non-commercial); see NOTICE." }
# Exact versions are pinned in requirements.lock (pip freeze of a working env).
dependencies = [
    "torch>=2.6",
    "torchvision",
    "transformers>=5.17,<6",
    "peft>=0.21",
    "safetensors",
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # no install needed for tests
